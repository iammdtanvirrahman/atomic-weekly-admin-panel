<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atomic Admin</title><style>body{margin:0;background:#0b0d10;color:#eee;font:15px system-ui}button{border:0;border-radius:9px;padding:10px 14px;background:#e13a27;color:white;font-weight:800;cursor:pointer}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{padding:22px 14px;background:#0d1014;border-right:1px solid #29313a}.brand{font:900 27px Georgia;margin-bottom:25px}.brand span{color:#e13a27}.nav{display:grid;gap:6px}.nav button{background:transparent;text-align:left;color:#bbb}.nav button.active,.nav button:hover{background:#191e24}.main{padding:28px;max-width:1500px;width:100%;box-sizing:border-box;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.top h1{font:900 44px Georgia;margin:0}.top h1 span{color:#e13a27}.view{display:none}.view.active{display:block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:#151a20;border:1px solid #29313a;border-radius:15px;padding:18px;margin-bottom:18px}.stat b{display:block;font-size:30px}.muted{color:#8e98a5}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.card{background:#181d23;border:1px solid #29313a;border-radius:14px;overflow:hidden}.cover{height:160px;background:#080a0d;display:flex;align-items:center;justify-content:center;color:#65707d}.cover img{width:100%;height:100%;object-fit:cover}.card-body{padding:15px}.card h3{font:800 20px Georgia;margin:0 0 8px}.meta{font-size:12px;color:#8e98a5;line-height:1.6}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.secondary{background:#29313a}.danger{background:#67231d}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.search,.token{background:#0e1217;border:1px solid #29313a;color:white;border-radius:9px;padding:11px;width:min(400px,100%);box-sizing:border-box}.empty{padding:30px;text-align:center;border:1px dashed #29313a;color:#8e98a5;border-radius:12px}.fileline{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px;border:1px solid #29313a;border-radius:11px;background:#14191f;margin:8px 0}@media(max-width:800px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid #29313a}.nav{display:flex;overflow:auto}.stats{grid-template-columns:1fr 1fr}.top{flex-direction:column;align-items:flex-start}}</style></head><body><div class="app"><aside class="side"><div class="brand">Atomic<span>Admin</span></div><nav class="nav"><button class="active" data-view="overview">⌂ Overview</button><button data-view="pdfs">▣ PDF Library</button><button data-view="incoming">↙ Incoming</button><button data-view="write">✎ Write Article</button><button data-view="published">● Published</button></nav></aside><main class="main"><header class="top"><div><h1>Atomic<span> Admin</span></h1><p class="muted">Editorial control center</p></div><button class="secondary" id="scan">↻ Scan PDFs</button></header><section id="overview" class="view active"><div class="stats"><div class="stat">Published<b id="publishedN">0</b></div><div class="stat">PDFs<b id="pdfN">0</b></div><div class="stat">Pending<b id="pendingN">0</b></div><div class="stat">Drafts<b id="draftN">0</b></div></div><div class="panel"><h2>GitHub Sync</h2><p class="muted">Token is stored only in this browser session.</p><div class="toolbar"><input class="token" id="token" type="password" placeholder="github_pat_…"><button id="saveToken">Save</button></div><p id="syncStatus" class="muted"></p></div><div class="panel"><h2>Recent Published</h2><div id="recent" class="grid"></div></div></section><section id="pdfs" class="view"><div class="panel"><h2>PDF Library</h2><div class="toolbar"><input class="search" id="pdfSearch" placeholder="Search PDF…"><button id="scan2">Scan GitHub</button></div><p id="pdfStatus" class="muted"></p><div id="pdfGrid" class="grid"></div></div></section><section id="incoming" class="view"><div class="panel"><h2>Incoming submissions</h2><div id="pending"></div></div></section><section id="write" class="view"><div class="panel"><h2>Write Article</h2><p class="muted">All normal articles now use the Word-style editor.</p><button id="newArticle">Open Article Editor</button></div></section><section id="published" class="view"><div class="panel"><h2>Published</h2><div class="toolbar"><input id="publishedSearch" class="search" placeholder="Search…"></div><div id="publishedGrid" class="grid"></div></div></section></main></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';import{getDatabase,ref,onValue,remove,update,set}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';const db=getDatabase(initializeApp({apiKey:'AIzaSyCit_SKjXRUpr8FNY1ahKhiG5sdDyOlW6k',authDomain:'atomictanvir.firebaseapp.com',projectId:'atomictanvir',storageBucket:'atomictanvir.firebasestorage.app',messagingSenderId:'140595401471',appId:'1:140595401471:web:8f92115a8c8b58d1ec32ca',databaseURL:'https://atomictanvir-default-rtdb.firebaseio.com'})),REPO='iammdtanvirrahman/atomic-weekly',$=x=>document.getElementById(x);let pub={},sub={};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function img(v){let s=String(v||'');if(!s)return'';if(/^(https?:\/\/|data:|\/|assets\/)/i.test(s))return s;return'assets/'+s}function view(n){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(n).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===n))}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>view(b.dataset.view));$('newArticle').onclick=()=>location.href='./editor.html';$('saveToken').onclick=()=>{sessionStorage.atomicWeeklyGh=$('token').value;$('syncStatus').textContent='Token saved.'};$('token').value=sessionStorage.atomicWeeklyGh||'';function edit(id){location.href='./editor.html?id='+encodeURIComponent(id)}function card(id,x){let image=img(x.image||x.coverImage),pdf=x.type==='pdf'||x.pdfUrl;return`<article class="card"><div class="cover">${image?`<img src="${esc(image)}">`:pdf?'PDF':'ARTICLE'}</div><div class="card-body"><h3>${esc(x.title||'Untitled')}</h3><div class="meta">${esc(x.author||'')} · ${esc(x.section||'')}<br>${esc(x.date||'')}</div><div class="actions">${pdf?`<button data-pdf="${esc(x.pdfUrl)}">View PDF</button>`:''}<button class="secondary" data-edit="${id}">Edit</button><button class="danger" data-del="${id}">Unpublish</button></div></div></article>`}function bind(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>window.open(b.dataset.pdf,'_blank'));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Unpublish this item?'))await remove(ref(db,'publishedArticles/'+b.dataset.del))})}function render(){let a=Object.entries(pub).sort((x,y)=>(y[1]?.timestamp||0)-(x[1]?.timestamp||0));$('publishedN').textContent=a.filter(x=>x[1]?.status==='published').length;$('draftN').textContent=a.filter(x=>x[1]?.status==='draft').length;$('pdfN').textContent=a.filter(x=>x[1]?.type==='pdf'||x[1]?.pdfUrl).length;$('recent').innerHTML=a.slice(0,6).map(x=>card(x[0],x[1])).join('')||'<div class="empty">Nothing published.</div>';$('publishedGrid').innerHTML=a.map(x=>card(x[0],x[1])).join('')||'<div class="empty">Nothing published.</div>';bind()}$('publishedSearch').oninput=()=>{let q=$('publishedSearch').value.toLowerCase();let a=Object.entries(pub).filter(([,x])=>JSON.stringify(x).toLowerCase().includes(q));$('publishedGrid').innerHTML=a.map(x=>card(x[0],x[1])).join('')||'<div class="empty">No matches.</div>';bind()};onValue(ref(db,'publishedArticles'),s=>{pub=s.val()||{};render()});onValue(ref(db,'submissions'),s=>{sub=s.val()||{};let a=Object.entries(sub).filter(([,x])=>x?.status!=='published');$('pendingN').textContent=a.length;$('pending').innerHTML=a.length?a.map(([id,x])=>`<div class="fileline"><div><b>${esc(x.title||'Untitled')}</b><div class="meta">${esc(x.author||'Reader')}<br>${esc((x.text||'').slice(0,160))}</div></div><div class="actions"><button data-sedit="${id}">Edit</button><button data-spub="${id}">Publish</button><button class="danger" data-sdel="${id}">Delete</button></div></div>`).join(''):'<div class="empty">No pending submissions.</div>';document.querySelectorAll('[data-sedit]').forEach(b=>b.onclick=()=>edit(b.dataset.sedit));document.querySelectorAll('[data-spub]').forEach(b=>b.onclick=async()=>{let id=b.dataset.spub;await set(ref(db,'publishedArticles/'+id),{...sub[id],id,status:'published',timestamp:Date.now()});await update(ref(db,'submissions/'+id),{status:'published'})});document.querySelectorAll('[data-sdel]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this submission?'))await remove(ref(db,'submissions/'+b.dataset.sdel))})});async function scan(){try{let r=await fetch('https://api.github.com/repos/'+REPO+'/contents/content');let a=await r.json();let p=a.filter(x=>x.type==='file'&&/\.pdf$/i.test(x.name));$('pdfN').textContent=p.length;$('pdfGrid').innerHTML=p.map((x,i)=>`<article class="card"><div class="cover">PDF</div><div class="card-body"><h3>${esc(x.name.replace(/\.pdf$/i,''))}</h3><div class="actions"><button data-openpdf="${i}">Open</button></div></div></article>`).join('')||'<div class="empty">No PDFs found.</div>';window.pdfs=p;document.querySelectorAll('[data-openpdf]').forEach(b=>b.onclick=()=>window.open('https://raw.githubusercontent.com/'+REPO+'/main/content/'+encodeURIComponent(window.pdfs[+b.dataset.openpdf].name),'_blank'));$('pdfStatus').textContent=p.length+' PDFs found.'}catch(e){$('pdfStatus').textContent=e.message}}$('scan').onclick=scan;$('scan2').onclick=scan;$('pdfSearch').oninput=()=>{let q=$('pdfSearch').value.toLowerCase();document.querySelectorAll('#pdfGrid .card').forEach(c=>c.style.display=c.innerText.toLowerCase().includes(q)?'':'none')};</script></body></html>
