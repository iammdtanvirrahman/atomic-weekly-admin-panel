<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d10">
<title>Atomic Admin — Pro Article Studio</title>
<style>
:root {
  --bg: #07090c;
  --panel: #0f1318;
  --panel2: #161c23;
  --line: #232a34;
  --text: #f0f2f5;
  --muted: #828e9e;
  --red: #e63946;
  --red-hover: #ff4d5a;
  --green: #2a9d8f;
  --accent: #4cc9f0;
  --paper-bg: #ffffff;
  --paper-text: #17191c;
  --shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: radial-gradient(1200px 600px at 80% -20%, #1a1528, transparent 70%), var(--bg);
  color: var(--text);
  font: 14px Inter, system-ui, -apple-system, sans-serif;
  overflow-x: hidden;
}

button, input, select, textarea { font: inherit; }
button {
  border: 0;
  border-radius: 8px;
  padding: 8px 12px;
  background: #202731;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.2s ease;
}
button:hover { background: #2c3644; filter: brightness(1.1); }
button.active { background: var(--red) !important; color: #fff; }
button.primary { background: var(--red); }
button.primary:hover { background: var(--red-hover); }
button.green { background: var(--green); }
button.ghost { background: transparent; border: 1px solid var(--line); }
button.ghost:hover { border-color: var(--muted); }
button:disabled { opacity: 0.4; cursor: not-allowed; }

/* Top Header Bar */
.top {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 20px;
  background: rgba(11, 14, 18, 0.85);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(16px);
}
.brand { font: 900 20px Georgia, serif; letter-spacing: -0.5px; }
.brand span { color: var(--red); }
.statusBadge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 20px;
  background: #18202a;
  border: 1px solid var(--line);
  color: var(--muted);
}
.statusDot { width: 8px; height: 8px; border-radius: 50%; background: #e9c46a; }
.statusDot.synced { background: var(--green); }
.statusDot.error { background: var(--red); }

.actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Main Toolbar */
.toolbarWrap {
  position: sticky;
  top: 57px;
  z-index: 90;
  background: rgba(18, 23, 30, 0.95);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
.toolbar, .subbar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  padding: 6px 12px;
}
.subbar {
  border-top: 1px solid rgba(255,255,255,0.05);
  overflow-x: auto;
  flex-wrap: nowrap;
}
.toolbar select {
  background: #202731;
  color: #fff;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 10px;
  outline: none;
}
.toolSep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
.colorBtn {
  width: 34px; height: 32px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 6px; background: #202731; cursor: pointer; position: relative;
  border: 1px solid transparent;
}
.colorBtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.count { margin-left: auto; color: var(--muted); font: 600 12px sans-serif; white-space: nowrap; }

/* Layout Grid */
.layout {
  display: grid;
  grid-template-columns: 280px minmax(500px, 1fr) 300px;
  min-height: calc(100vh - 115px);
  transition: all 0.3s ease;
}
body.focusMode .left, body.focusMode .right, body.focusMode .toolbarWrap { display: none !important; }
body.focusMode .layout { grid-template-columns: 1fr; }
body.focusMode .workspace { padding: 40px 0; }

.left, .right { background: var(--panel); padding: 16px; overflow-y: auto; }
.left { border-right: 1px solid var(--line); }
.right { border-left: 1px solid var(--line); }

.sectionTitle {
  font: 800 11px sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin: 12px 0 10px;
}
.field { margin-bottom: 12px; }
.field label { display: block; font: 700 11px sans-serif; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 10px; background: #0b0e12; border: 1px solid var(--line); border-radius: 8px; color: #fff; outline: 0; transition: border 0.2s;
}
.field textarea { min-height: 75px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }

/* Workspace & Paper */
.workspace {
  overflow-y: auto; background: #1a1e24; padding: 40px 20px 120px;
  display: flex; flex-direction: column; align-items: center;
}
.paper {
  width: 800px; min-height: 1120px; background: var(--paper-bg); color: var(--paper-text);
  box-shadow: var(--shadow); border-radius: 4px; position: relative; transition: background 0.3s, color 0.3s;
}
body.darkPaper .paper { --paper-bg: #12161c; --paper-text: #e2e8f0; }

.articlePage {
  min-height: 1120px; padding: 80px; outline: 0; font-family: Georgia, serif; font-size: 18px; line-height: 1.8;
}
.articlePage h1 { font-size: 44px; line-height: 1.1; margin: 0 0 20px; font-weight: 800; }
.articlePage h2 { font-size: 30px; line-height: 1.2; margin: 32px 0 14px; }
.articlePage h3 { font-size: 22px; line-height: 1.3; margin: 24px 0 10px; }
.articlePage p { margin: 0 0 1.2em; }
.articlePage blockquote {
  margin: 24px 0; padding: 16px 24px; border-left: 4px solid var(--red); background: rgba(0,0,0,0.03); font-style: italic;
}
body.darkPaper .articlePage blockquote { background: rgba(255,255,255,0.03); }
.articlePage pre { background: #1e242c; color: #f8f9fa; padding: 16px; border-radius: 8px; font-family: monospace; overflow-x: auto; }

/* Interactive Media Layers */
.mediaLayer {
  position: relative; display: inline-block; max-width: 100%; margin: 20px 0; user-select: none; touch-action: none; vertical-align: top;
}
.mediaLayer img, .mediaLayer iframe { display: block; width: 100%; height: auto; border-radius: 6px; }
.mediaLayer iframe { height: 420px; border: 0; }
.mediaLayer.selectedMedia { outline: 2px solid var(--red); outline-offset: 4px; }

/* Alignment presets */
.mediaLayer[data-align="left"] { float: left; margin: 10px 24px 16px 0; max-width: 50%; }
.mediaLayer[data-align="right"] { float: right; margin: 10px 0 16px 24px; max-width: 50%; }
.mediaLayer[data-align="center"] { display: block; margin: 24px auto; text-align: center; }
.mediaLayer[data-align="full"] { display: block; width: 100% !important; margin: 28px 0; }

.mediaHandles { position: absolute; inset: -12px; pointer-events: none; z-index: 30; }
.mediaHandle {
  position: absolute; width: 12px; height: 12px; background: var(--red); border: 2px solid #fff; border-radius: 50%; pointer-events: auto; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}
.mediaHandle[data-action="resizeBR"] { right: -6px; bottom: -6px; cursor: nwse-resize; }
.mediaHandle[data-action="resizeBL"] { left: -6px; bottom: -6px; cursor: nesw-resize; }
.mediaHandle[data-action="rotate"] { left: 50%; top: -24px; transform: translateX(-50%); cursor: grab; }
.mediaHandle[data-action="rotate"]:after { content: "↻"; position: absolute; top: -18px; left: 50%; transform: translateX(-50%); color: var(--red); font-weight: bold; }

.mediaToolbar {
  position: absolute; top: -45px; left: 50%; transform: translateX(-50%);
  background: #11151a; border: 1px solid var(--line); border-radius: 8px; padding: 4px; display: flex; gap: 4px;
  pointer-events: auto; box-shadow: 0 6px 20px rgba(0,0,0,0.5); z-index: 40;
}
.mediaToolbar button { padding: 4px 8px; font-size: 11px; height: 26px; }
.mediaDelete { background: var(--red) !important; color: #fff; }

.mediaOpacity {
  position: absolute; left: -35px; top: 50%; transform: translateY(-50%) rotate(-90deg);
  width: 80px; accent-color: var(--red); pointer-events: auto;
}

/* Tables */
.articlePage table { width: 100%; border-collapse: collapse; margin: 24px 0; }
.articlePage td, .articlePage th { border: 1px solid var(--line); padding: 10px 14px; }
.page-break { break-before: page; border-top: 2px dashed var(--muted); margin: 40px 0; text-align: center; }
.page-break:after { content: "Page Break"; font-size: 10px; color: var(--muted); text-transform: uppercase; position: relative; top: -10px; background: var(--paper-bg); padding: 0 8px; }

/* Gallery & Asset Upload */
.gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: calc(100vh - 360px); overflow-y: auto; }
.asset { border: 1px solid var(--line); background: #141920; border-radius: 8px; padding: 6px; cursor: pointer; transition: border 0.2s; }
.asset:hover { border-color: var(--accent); }
.asset img { width: 100%; height: 85px; object-fit: cover; border-radius: 4px; display: block; }
.asset span { display: block; font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; }
.dropZone { border: 2px dashed var(--line); padding: 14px; text-align: center; border-radius: 8px; color: var(--muted); font-size: 11px; margin-bottom: 12px; cursor: pointer; }
.dropZone:hover { border-color: var(--accent); color: #fff; }

/* Source View */
.sourceEditor {
  display: none; width: 100%; min-height: 1120px; border: 0; outline: 0; padding: 80px; font: 14px ui-monospace, monospace;
  resize: none; color: #70a1ff; background: #0d1117; line-height: 1.6;
}
.sourceMode .sourceEditor { display: block; }
.sourceMode #editor { display: none; }

/* Modals */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 200; backdrop-filter: blur(4px); }
.modal.open { display: flex; }
.modalBox { width: min(680px, 100%); max-height: 90vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; box-shadow: var(--shadow); }
.modalBox h3 { font: 800 20px Georgia; margin: 0 0 16px; }

@media (max-width: 1100px) {
  .layout { grid-template-columns: 240px 1fr; }
  .right { display: none; }
}
@media (max-width: 768px) {
  .layout { display: block; }
  .paper { width: 100%; }
  .articlePage { padding: 30px 20px; }
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">Atomic<span>Admin</span> Studio</div>
  <div class="statusBadge"><span class="statusDot" id="statusDot"></span><span id="statusMsg">Ready</span></div>
  <div class="actions">
    <button id="togglePaperTheme" title="Switch Paper Theme">🌓 Dark/Light</button>

<div class="toolbarWrap">

<div class="layout">

<!-- Modals -->
<div id="linkModal" class="modal"><div class="modalBox"><h3>Insert Link</h3><div class="field"><label>URL</label><input id="linkUrl" placeholder="https://"></div><div class="actions"><button id="closeLink">Cancel</button><button class="primary" id="applyLink">Apply</button></div></div></div>
<div id="previewModal" class="modal"><div class="modalBox" style="width:800px"><h3>Article Preview</h3><div id="previewContent" style="background:#fff;color:#111;padding:40px;border-radius:8px;"></div><button id="closePreview" style="margin-top:14px">Close</button></div></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, set, onValue } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const cfg = { apiKey: 'AIzaSyCit_SKjXRUpr8FNY1ahKhiG5sdDyOlW6k', authDomain: 'atomictanvir.firebaseapp.com', projectId: 'atomictanvir', databaseURL: 'https://atomictanvir-default-rtdb.firebaseio.com' };
const db = getDatabase(initializeApp(cfg)), $ = id => document.getElementById(id);
const PUBLIC = 'https://iammdtanvirrahman.github.io/atomic-weekly/';
const ASSET_API = 'https://api.github.com/repos/iammdtanvirrahman/atomic-weekly/contents/assets?ref=main';

let savedRange = null, selectedMedia = null, selectedGalleryUrl = '', sourceMode = false, history = [], historyIndex = -1, saveTimer = null, dragState = null;

function setStatus(msg, status = 'synced') {
  $('statusMsg').textContent = msg;
  $('statusDot').className = 'statusDot ' + status;
}

function saveSelection() {
  const s = getSelection();
  if (s && s.rangeCount) savedRange = s.getRangeAt(0).cloneRange();
}
function restoreSelection() {
  const s = getSelection();
  s.removeAllRanges();
  if (savedRange) s.addRange(savedRange);
}

function cmd(c, v = null) {
  restoreSelection();
  document.execCommand(c, false, v);
  $('editor').focus();
  pushHistory();
  updateStats();
}

function pushHistory() {
  if (sourceMode) return;
  const html = $('editor').innerHTML;
  if (history[historyIndex] === html) return;
  history = history.slice(0, historyIndex + 1);
  history.push(html);
  if (history.length > 50) history.shift();
  historyIndex = history.length - 1;
}

function applyHistory(dir) {
  if (!history.length) return;
  historyIndex = Math.max(0, Math.min(history.length - 1, historyIndex + dir));
  $('editor').innerHTML = history[historyIndex] || '';
  updateStats();
}

function updateStats() {
  const text = (sourceMode ? $('sourceEditor').value :$('editor').innerText).trim();
  const words = text ? text.split(/\s+/).length : 0;
  const chars = text.length;
  const readTime = Math.max(1, Math.ceil(words / 200));
  $('count').textContent = `${words} words · ${chars} chars · ${readTime} min read`;

  // Auto-generate TOC
  const headings = Array.from($('editor').querySelectorAll('h1, h2, h3'));
  if (headings.length) {
    $('tocList').innerHTML = headings.map(h => `<div>• ${h.innerText || 'Untitled Heading'}</div>`).join('');
  } else {
    $('tocList').innerHTML = 'No headings present.';
  }
}

/* Media Layer Controls */
function addMediaToolbar(layer) {
  if (layer.querySelector('.mediaHandles')) return;
  const h = document.createElement('div');
  h.className = 'mediaHandles';
  h.contentEditable = 'false';
  h.innerHTML = `
    <div class="mediaToolbar">
      <button data-align="left">Left</button>
      <button data-align="center">Center</button>
      <button data-align="right">Right</button>
      <button data-align="full">Full</button>
      <button class="mediaDelete">✕</button>
    </div>
    <span class="mediaHandle" data-action="resizeBR"></span>
    <span class="mediaHandle" data-action="resizeBL"></span>
    <span class="mediaHandle" data-action="rotate"></span>
    <input class="mediaOpacity" type="range" min="10" max="100" value="100">
  `;
  layer.appendChild(h);

  h.querySelectorAll('.mediaToolbar button[data-align]').forEach(btn => {
    btn.onclick = e => { e.stopPropagation(); layer.dataset.align = btn.dataset.align; scheduleLocalSave(); };
  });
  h.querySelector('.mediaDelete').onclick = e => { e.stopPropagation(); layer.remove(); clearMediaSelection(); pushHistory(); };
  h.querySelector('.mediaOpacity').oninput = e => { layer.style.opacity = (e.target.value / 100).toFixed(2); };
  h.querySelectorAll('.mediaHandle').forEach(handle => {
    handle.onpointerdown = e => startMediaAction(e, layer, handle.dataset.action);
  });
}

function selectMedia(layer) {
  clearMediaSelection();
  selectedMedia = layer;
  layer.classList.add('selectedMedia');
  addMediaToolbar(layer);
}

function clearMediaSelection() {
  if (selectedMedia) {
    selectedMedia.classList.remove('selectedMedia');
    selectedMedia.querySelector('.mediaHandles')?.remove();
  }
  selectedMedia = null;
}

function startMediaAction(e, layer, action) {
  e.preventDefault(); e.stopPropagation();
  const rect = layer.getBoundingClientRect();
  dragState = { layer, action, startX: e.clientX, startY: e.clientY, startW: rect.width, startR: parseFloat(layer.dataset.rotate || '0') };
  document.addEventListener('pointermove', mediaPointerMove);
  document.addEventListener('pointerup', mediaPointerUp, { once: true });
}

function mediaPointerMove(e) {
  if (!dragState) return;
  const dx = e.clientX - dragState.startX;
  if (dragState.action === 'resizeBR') {
    dragState.layer.style.width = Math.max(100, dragState.startW + dx) + 'px';
  } else if (dragState.action === 'rotate') {
    dragState.layer.dataset.rotate = (dragState.startR + dx * 0.5).toFixed(1);
    dragState.layer.style.transform = `rotate(${dragState.layer.dataset.rotate}deg)`;
  }
}

function mediaPointerUp() {
  if (dragState) { pushHistory(); scheduleLocalSave(); dragState = null; }
  document.removeEventListener('pointermove', mediaPointerMove);
}

/* Event Listeners */
$('toolbar').querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => cmd(b.dataset.cmd));$('fontName').onchange = e => cmd('fontName', e.target.value);
$('fontSize').onchange = e => cmd('fontSize', e.target.value);$('block').onchange = e => cmd('formatBlock', `<${e.target.value}>`);
$('textColor').oninput = e => cmd('foreColor', e.target.value);
$('highlight').oninput = e => cmd('hiliteColor', e.target.value);$('undo').onclick = () => applyHistory(-1);
$('redo').onclick = () => applyHistory(1);$('togglePaperTheme').onclick = () => document.body.classList.toggle('darkPaper');

$('editor').addEventListener('click', e => {
  const layer = e.target.closest('.mediaLayer');
  if (layer) selectMedia(layer); else clearMediaSelection();
});

$('editor').addEventListener('keyup', () => { saveSelection(); updateStats(); scheduleLocalSave(); });$('editor').addEventListener('input', () => { updateStats(); scheduleLocalSave(); });

/* Custom Inserts */
function insertHtml(html) {
  restoreSelection();
  document.execCommand('insertHTML', false, html);
  $('editor').focus();
  pushHistory();
  updateStats();
}

$('insertImage').onclick = () => {
  if (selectedGalleryUrl) insertHtml(`<div class="mediaLayer" data-align="center"><img src="${selectedGalleryUrl}"></div>`);
  else alert('Please select an asset from the gallery first.');
};

$('embedVideo').onclick = () => {
  const url = prompt('Enter YouTube Video URL:');
  if (!url) return;
  const id = url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.split('/').pop();
  insertHtml(`<div class="mediaLayer" data-align="center"><iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe></div>`);
};

$('insertTable').onclick = () => insertHtml(`<table><tr><th>Header 1</th><th>Header 2</th></tr><tr><td>Data 1</td><td>Data 2</td></tr></table>`);
$('addTableRow').onclick = () => {
  const sel = getSelection().anchorNode?.parentElement?.closest('table');
  if (sel) { const row = sel.insertRow(); row.innerHTML = '<td>New Cell</td><td>New Cell</td>'; }
};
$('addTableCol').onclick = () => {
  const sel = getSelection().anchorNode?.parentElement?.closest('table');
  if (sel) Array.from(sel.rows).forEach(r => r.insertCell().innerText = 'New Cell');
};

$('pageBreak').onclick = () => insertHtml('<div class="page-break"></div>');

/* Source Code Mode */
$('source').onclick = () => {
  sourceMode = !sourceMode;
  document.body.classList.toggle('sourceMode', sourceMode);
  if (sourceMode) $('sourceEditor').value =$('editor').innerHTML;
  else { $('editor').innerHTML =$('sourceEditor').value; pushHistory(); }
};

/* Assets Loading */
async function loadAssets() {
  try {
    const r = await fetch(ASSET_API);
    const files = await r.json();
    const urls = files.filter(x => /\.(png|jpe?g|webp|gif)$/i.test(x.name)).map(x => ({ name: x.name, url: x.download_url }));
    renderAssets(urls);
  } catch (e) { $('gallery').innerHTML = '<div style="font-size:11px;color:var(--muted)">Failed to fetch remote assets. You can upload local images below.</div>'; }
}

function renderAssets(items) {
  const q = $('assetSearch').value.toLowerCase();$('gallery').innerHTML = '';
  items.filter(x => x.name.toLowerCase().includes(q)).forEach(x => {
    const d = document.createElement('div');
    d.className = 'asset';
    d.innerHTML = `<img src="${x.url}"><span>${x.name}</span>`;
    d.onclick = () => {
      selectedGalleryUrl = x.url;
      document.querySelectorAll('.asset').forEach(a => a.style.borderColor = '');
      d.style.borderColor = 'var(--red)';
    };
    $('gallery').appendChild(d);
  });
}
$('assetSearch').oninput = loadAssets;

/* Local Upload Handling */
$('dropZone').onclick = () => $('localFileInput').click();$('localFileInput').onchange = e => {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = ev => {
      selectedGalleryUrl = ev.target.result;
      insertHtml(`<div class="mediaLayer" data-align="center"><img src="${selectedGalleryUrl}"></div>`);
    };
    reader.readAsDataURL(file);
  }
};

/* Auto-Save & Local Payload */
function payload() {
  return {
    title: $('title').value || 'Untitled',
    author: $('author').value,
    section: $('section').value,
    dek: $('dek').value,
    cover: $('cover').value,
    content: sourceMode ? $('sourceEditor').value :$('editor').innerHTML,
    updatedAt: Date.now()
  };
}

function scheduleLocalSave() {
  setStatus('Saving...', 'error');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    localStorage.setItem('atomic_article_draft', JSON.stringify(payload()));
    setStatus('Draft saved locally', 'synced');
  }, 800);
}

$('saveDraft').onclick = async () => {
  try {
    const data = payload();
    await set(ref(db, 'atomicWeekly/drafts/' + Date.now()), data);
    setStatus('Saved to Cloud', 'synced');
  } catch (e) { setStatus('Cloud save failed', 'error'); }
};

/* Exports */
$('exportHtml').onclick = () => {
  const blob = new Blob([$('editor').innerHTML], { type: 'text/html' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'article.html'; a.click();
};

$('exportMd').onclick = () => {
  let md = $('editor').innerText;
  const blob = new Blob([md], { type: 'text/markdown' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'article.md'; a.click();
};

$('print').onclick = () => window.print();$('focus').onclick = () => document.body.classList.toggle('focusMode');

/* Preview Modal */
$('preview').onclick = () => {
  const p = payload();
  $('previewContent').innerHTML = `<h1>${p.title}</h1><p><em>By ${p.author} in ${p.section}</em></p><hr>${p.content}`;
  $('previewModal').classList.add('open');
};
$('closePreview').onclick = () =>$('previewModal').classList.remove('open');

/* Initialize */
const local = localStorage.getItem('atomic_article_draft');
if (local) {
  try {
    const p = JSON.parse(local);
    $('title').value = p.title || '';
    $('author').value = p.author \vert{}\vert{} '';$('section').value = p.section || '';
    $('dek').value = p.dek \vert{}\vert{} '';$('editor').innerHTML = p.content || '';
  } catch(e) {}
}

loadAssets();
updateStats();
pushHistory();
</script>
</body>
</html>
